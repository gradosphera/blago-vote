on:
  push:
    - workflows: [deploy-site]
      filter:
        branches: ["main"]

workflows:
  deploy-site:
    tasks:
      - name: build-and-publish
        cubes:
          - name: install-and-build
            image: node:20
            script:
              - yarn install --frozen-lockfile
              - yarn build

          - name: publish-release
            script:
              - |
                cd $SOURCECRAFT_WORKSPACE
                git config user.name "$SOURCECRAFT_USERNAME"
                git config user.email "$SOURCECRAFT_USERNAME@noreply.sourcecraft.dev"
                git fetch origin release || true
                if git rev-parse --verify origin/release >/dev/null 2>&1; then
                  git checkout -B release origin/release
                else
                  git checkout -B release
                fi
                # Сохраняем свежую сборку, чистим ветку, возвращаем сборку
                mv dist /sourcecraft/dist
                find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
                mv /sourcecraft/dist dist
                git add -A
                git commit -m "Deploy build $SOURCECRAFT_COMMIT_SHORT_SHA from $SOURCECRAFT_COMMIT_REF_NAME" || echo "Nothing to commit"
                git push origin release
